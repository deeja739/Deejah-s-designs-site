<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - Deejah's Designs</title>
    <link rel="stylesheet" href="Styles.css">
</head>
<body>
    <header>
        <h1>Our Luxury Collection</h1>
        <a href="index.html" class="back-btn">⬅ Back to Home</a>
    </header>
    <section class="gallery" id="gallery"></section>

<script>
    // Number of images you have
    const totalImages = 39;  
    const gallery = document.getElementById("gallery");

    for (let i = 1; i <= totalImages; i++) {
        let imgDiv = document.createElement("div");
        imgDiv.classList.add("gallery-item");

        let img = document.createElement("img");
        img.src = `images/design${i}.png`;  // Adjust file extension if needed
        img.alt = `Design ${i}`;

        let overlay = document.createElement("div");
        overlay.classList.add("overlay");
        overlay.innerText = `Luxury Design ${i}`;

        imgDiv.appendChild(img);
        imgDiv.appendChild(overlay);
        gallery.appendChild(imgDiv);
    }
</script>

    

    <footer>
        <p>&copy; 2025 Deejah's Designs~ | All rights reserved.</p>
    </footer>
</body>
</html>
