<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - Deejah's Designs</title>
    <link rel="stylesheet" href="Styles.css">
</head>
<body>
    <header>
        <h1>Our Luxury Collection</h1>
        <a href="index.html" class="back-btn">⬅ Back to Home</a>
    </header>

    <section class="gallery" id="gallery"></section>
<script>
    const albumSizes = [7, 7, 6, 7, 8, 4];
    const gallery = document.getElementById("gallery");

    let imgIndex = 1;

    for (let album = 1; album <= albumSizes.length; album++) {
        for (let design = 1; design <= albumSizes[album - 1]; design++) {
            let imgPath = `images/album${album}_design${design}.png`;

            let imgDiv = document.createElement("div");
            imgDiv.classList.add("gallery-item");

            let img = document.createElement("img");
            img.src = imgPath;
            img.alt = `Design ${imgIndex}`;

            let overlay = document.createElement("div");
            overlay.classList.add("overlay");
            overlay.innerText = `Luxury Design ${imgIndex}`;

            imgDiv.appendChild(img);
            imgDiv.appendChild(overlay);
            gallery.appendChild(imgDiv);

            imgIndex++;
        }
    }
</script>
    <footer>
        <p>&copy; 2025 Deejah's Designs~ | All rights reserved.</p>
    </footer>
</body>
</html>
